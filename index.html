<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>济事楼导览 · 同济大学计算机科学与技术学院</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <div class="site-title">
        <h1>济事楼导览</h1>
        <p>同济大学计算机科学与技术学院 · 四至五层</p>
      </div>
      <div class="site-search">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input id="searchInput" type="search" autocomplete="off"
               placeholder="搜索房间号、名称或人员姓名">
        <button id="searchClear" class="search-clear" title="清除" aria-label="清除">×</button>
      </div>
    </div>
  </header>

  <nav class="subnav" aria-label="楼层与分类">
    <div class="subnav-inner">
      <div class="nav-group">
        <span class="nav-label">楼层</span>
        <button class="nav-link is-active" data-floor="4">四楼</button>
        <button class="nav-link"           data-floor="5">五楼</button>
      </div>
      <div class="nav-group">
        <span class="nav-label">视图</span>
        <button class="nav-link is-active" data-view="plan"><span class="nav-emoji">🗺️</span>平面图</button>
        <button class="nav-link"           data-view="list"><span class="nav-emoji">📋</span>列表</button>
      </div>
      <div class="nav-group" id="categoryFilter">
        <span class="nav-label">分类</span>
      </div>
    </div>
  </nav>

  <main class="layout">
    <section class="content">
      <div id="planView" class="plan-view">
        <div class="section-bar">
          <h2 id="planTitle">济事楼四楼平面图</h2>
          <span class="section-meta" id="planMeta"></span>
        </div>
        <div class="plan-canvas">
          <svg id="floorPlan" preserveAspectRatio="xMidYMid meet" aria-label="楼层平面图"></svg>
        </div>
        <ul class="plan-legend" aria-label="图例">
          <li><span class="swatch" data-cat="office"></span>行政办公</li>
          <li><span class="swatch" data-cat="teaching"></span>教学空间</li>
          <li><span class="swatch" data-cat="research"></span>科研空间</li>
          <li><span class="swatch" data-cat="service"></span>服务窗口</li>
          <li><span class="swatch" data-cat="unknown"></span>辅助用房</li>
          <li><span class="swatch" data-cat="blocked"></span>此路不通</li>
        </ul>
      </div>

      <div id="listView" class="list-view" hidden>
        <div class="section-bar">
          <h2>房间列表</h2>
          <span class="section-meta" id="resultCount"></span>
        </div>
        <div id="floorSections"></div>
        <p id="emptyHint" class="empty-hint" hidden>未找到符合条件的房间</p>
      </div>
    </section>

    <aside id="detailPanel" class="detail" aria-label="房间详情">
      <div class="detail-empty">
        <div class="empty-icon" aria-hidden="true">📍</div>
        <p>请在左侧平面图中选择房间<br>查看用途与人员信息</p>
      </div>
    </aside>
  </main>

  <div id="tooltip" class="tooltip" hidden></div>

  <footer class="site-footer">
    <p>同济大学计算机科学与技术学院 · 济事楼导览（课程作业）</p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
