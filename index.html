<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>济事楼导览系统 · 同济大学</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 顶部栏：始终可见的全局导航与搜索 -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">济</span>
      <div class="brand-text">
        <h1>济事楼导览系统</h1>
        <p>同济大学计算机科学与技术学院 · 4-5 层</p>
      </div>
    </div>
    <div class="search-wrap">
      <input id="searchInput" type="search" autocomplete="off"
             placeholder="搜索房间号 / 名称 / 老师姓名，如「学工办」「葛蕾」「448」">
      <button id="searchClear" class="search-clear" title="清除" aria-label="清除搜索">×</button>
    </div>
  </header>

  <!-- 控制栏：楼层切换 + 视图切换 + 分类筛选 -->
  <nav class="controls" aria-label="楼层与分类导航">
    <div class="floor-switch" role="tablist" aria-label="楼层选择">
      <button class="floor-btn is-active" data-floor="4" role="tab">4 楼</button>
      <button class="floor-btn"           data-floor="5" role="tab">5 楼</button>
    </div>
    <div class="view-switch" role="tablist" aria-label="视图选择">
      <button class="view-btn is-active" data-view="plan" role="tab">🗺️ 平面图</button>
      <button class="view-btn"           data-view="list" role="tab">📋 列表</button>
    </div>
    <div id="categoryFilter" class="category-filter" aria-label="房间分类筛选"></div>
  </nav>

  <main class="layout">
    <!-- 左侧：主内容区（平面图或列表） -->
    <section class="content" aria-label="房间总览">
      <!-- 平面图视图 -->
      <div id="planView" class="plan-view">
        <div class="plan-hint">
          <span id="planTitle">济事楼 4 楼平面图</span>
          <span class="plan-tip">点击房间查看详情 · 当前 <b id="planMatchCount">—</b> 间匹配</span>
        </div>
        <div class="plan-canvas">
          <svg id="floorPlan" preserveAspectRatio="xMidYMid meet" aria-label="楼层平面图"></svg>
        </div>
        <div class="plan-legend">
          <span class="legend-title">图例：</span>
          <span class="legend-item"><i class="dot" style="background:#3b6ea5"></i>行政办公</span>
          <span class="legend-item"><i class="dot" style="background:#2e8b57"></i>教学空间</span>
          <span class="legend-item"><i class="dot" style="background:#8a5cb0"></i>科研空间</span>
          <span class="legend-item"><i class="dot" style="background:#c0563b"></i>服务窗口</span>
          <span class="legend-item"><i class="dot" style="background:#9aa3ad"></i>辅助用房</span>
          <span class="legend-item"><i class="dot" style="background:#d33b3b"></i>此路不通</span>
        </div>
      </div>

      <!-- 列表视图 -->
      <div id="listView" class="list-view" hidden>
        <div class="overview-head">
          <h2>房间列表</h2>
          <span id="resultCount" class="result-count"></span>
        </div>
        <div id="floorSections"></div>
        <p id="emptyHint" class="empty-hint" hidden>未找到匹配的房间，请尝试其它关键字。</p>
      </div>
    </section>

    <!-- 右侧：房间详情 -->
    <aside id="detailPanel" class="detail" aria-label="房间详情">
      <div class="detail-placeholder">
        <div class="ph-icon">🏛️</div>
        <p>点击平面图上的任意房间<br>或在搜索框中输入关键字</p>
      </div>
    </aside>
  </main>

  <!-- 悬停提示 -->
  <div id="tooltip" class="tooltip" hidden></div>

  <footer class="footer">
    <p>课程作业 · Assignment 4 Fluid Navigation ｜ 数据基于济事楼 4-5 层实地整理</p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
